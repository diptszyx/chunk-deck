<title>Chunk Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --ground: #f6f7f4;
    --surface: #ffffff;
    --inset: #eceee9;
    --line: #d9ddd5;
    --ink: #1a2320;
    --ink-dim: #55615c;
    --ink-faint: #8a948f;
    --accent: #0e6b5f;
    --accent-ink: #ffffff;
    --accent-soft: #d8ece8;
    --stress: #b4621a;
    --stress-soft: #f5e6d6;
    --miss: #b23a2e;
    --miss-soft: #f6dfdb;
    --hit: #2a7a4b;
    --focus: #0e6b5f;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111614;
      --surface: #19201d;
      --inset: #202824;
      --line: #2e3833;
      --ink: #e8ece9;
      --ink-dim: #a7b1ac;
      --ink-faint: #6f7a75;
      --accent: #4fb7a6;
      --accent-ink: #0b1311;
      --accent-soft: #173430;
      --stress: #e59a55;
      --stress-soft: #3a2918;
      --miss: #e58476;
      --miss-soft: #3b1f1b;
      --hit: #6cc792;
      --focus: #4fb7a6;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111614;
    --surface: #19201d;
    --inset: #202824;
    --line: #2e3833;
    --ink: #e8ece9;
    --ink-dim: #a7b1ac;
    --ink-faint: #6f7a75;
    --accent: #4fb7a6;
    --accent-ink: #0b1311;
    --accent-soft: #173430;
    --stress: #e59a55;
    --stress-soft: #3a2918;
    --miss: #e58476;
    --miss-soft: #3b1f1b;
    --hit: #6cc792;
    --focus: #4fb7a6;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 20px 48px;
  }
  .app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
  h1 span { color: var(--accent); }
  .meter { display: flex; gap: 14px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .meter b { color: var(--ink); font-weight: 700; }
  .sync { font-size: 12px; color: var(--ink-faint); }

  nav.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--inset); padding: 4px; border-radius: 12px; }
  nav.modes button {
    font: 700 14px/1.2 var(--body); color: var(--ink-dim); background: transparent; border: 0;
    padding: 10px 6px; border-radius: 9px; cursor: pointer;
  }
  nav.modes button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  nav.modes small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .stage {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 320px;
  }
  .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .situation { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--inset); color: var(--ink-dim); }
  .prompt-vi { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.3; text-wrap: balance; margin: 0; }
  .hint { font-size: 14px; color: var(--ink-dim); margin: 0; }

  .answer { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--accent-soft); border-radius: 12px; }
  .chunk { font-size: 26px; font-weight: 700; line-height: 1.3; text-wrap: balance; margin: 0; }
  .chunk .s { color: var(--stress); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
  .reduced { font-family: var(--mono); font-size: 14px; color: var(--ink-dim); }
  .reduced b { color: var(--stress); font-weight: 700; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.btn {
    font: 700 15px/1 var(--body); padding: 13px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: 1 1 auto;
  }
  button.btn:hover { border-color: var(--ink-faint); }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn.again { border-color: var(--miss); color: var(--miss); }
  button.btn.good { border-color: var(--accent); color: var(--accent); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.icon { flex: 0 0 auto; }
  .grade-note { font-size: 12px; color: var(--ink-faint); text-align: center; margin: 0; font-variant-numeric: tabular-nums; }

  .done { text-align: center; padding: 30px 10px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .done strong { font-family: var(--display); font-size: 22px; }

  input.dict {
    font: 400 18px/1.4 var(--body); width: 100%; padding: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink);
  }
  .diff { font-size: 20px; line-height: 1.7; display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .diff .w-hit { color: var(--hit); }
  .diff .w-miss { background: var(--miss-soft); color: var(--miss); padding: 0 5px; border-radius: 5px; font-weight: 700; }
  .diff .w-extra { color: var(--ink-faint); text-decoration: line-through; }
  .score { font-family: var(--mono); font-size: 13px; color: var(--ink-dim); }

  .clock { font-family: var(--mono); font-weight: 700; font-size: 64px; letter-spacing: -0.02em; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
  .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .phase { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--inset); color: var(--ink-faint); font-size: 13px; }
  .phase b { display: block; font-family: var(--mono); font-size: 16px; color: var(--ink-dim); }
  .phase[data-state="now"] { background: var(--accent); color: var(--accent-ink); }
  .phase[data-state="now"] b { color: var(--accent-ink); }
  .phase[data-state="done"] { background: var(--accent-soft); color: var(--accent); }
  .topic { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.3; margin: 0; text-wrap: balance; }
  .weave { display: flex; flex-wrap: wrap; gap: 6px; }
  .weave span { font-size: 14px; padding: 5px 10px; border-radius: 999px; border: 1px dashed var(--accent); color: var(--accent); }

  .why { font-size: 13px; color: var(--ink-dim); border-top: 1px solid var(--line); padding-top: 14px; margin: 0; max-width: 65ch; }
  .why b { color: var(--ink); }
  .warn { font-size: 13px; color: var(--miss); margin: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .answer, .diff { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>

<div class="app">
  <header class="top">
    <h1>Chunk<span>Deck</span></h1>
    <div class="meter">
      <span>Cần ôn <b id="mDue">0</b></span>
      <span>Đã thuộc <b id="mKnown">0</b>/<b id="mTotal">0</b></span>
    </div>
  </header>
  <p class="sync" id="syncNote">Tiến độ đang lưu trên trình duyệt này.</p>

  <nav class="modes" role="tablist" aria-label="Chế độ luyện">
    <button role="tab" id="tabReview" aria-selected="true">Ôn cụm<small>nhớ lại, rồi nghe</small></button>
    <button role="tab" id="tabDict" aria-selected="false">Nghe chép<small>tách từ trong câu nói</small></button>
    <button role="tab" id="tabSpeak" aria-selected="false">Nói 4/3/2<small>1 chuyện, 3 lần</small></button>
  </nav>

  <section class="stage" id="stage" aria-live="polite"></section>

  <p class="why" id="why"></p>
</div>

<script>
(() => {
  const DECK = [
    ["Mở đầu, giữ lượt", "Ý là…, vấn đề là…", "The *thing* is…", ""],
    ["Mở đầu, giữ lượt", "Tôi định nói là…", "I was *gonna* say…", "was <b>gonna</b> = going to"],
    ["Mở đầu, giữ lượt", "Để tôi nói cách khác", "Let me put it *another* way", "let me → <b>lemme</b>"],
    ["Mở đầu, giữ lượt", "Chờ chút, để tôi nghĩ", "Give me a *second*", "give me → <b>gimme</b>"],
    ["Mở đầu, giữ lượt", "Nói thật là…", "To be *honest*…", ""],
    ["Mở đầu, giữ lượt", "Về cơ bản là…", "*Basically*…", ""],
    ["Mở đầu, giữ lượt", "Còn chuyện…thì sao?", "What about…?", "what about → <b>whaddabout</b>"],
    ["Mở đầu, giữ lượt", "Quay lại chuyện lúc nãy", "Going *back* to what you said", ""],
    ["Kiểm tra hiểu", "Bạn hiểu ý tôi không?", "Does that make *sense*?", ""],
    ["Kiểm tra hiểu", "Bạn nói lại được không?", "Could you say that *again*?", "could you → <b>couldja</b>"],
    ["Kiểm tra hiểu", "Ý bạn là…?", "Do you *mean*…?", "do you → <b>d'you</b>"],
    ["Kiểm tra hiểu", "Nói chậm hơn chút được không?", "Could you speak a bit *slower*?", ""],
    ["Kiểm tra hiểu", "Tôi không chắc đã hiểu đúng", "I'm not *sure* I follow", ""],
    ["Kiểm tra hiểu", "Để tôi xem mình hiểu đúng không", "Let me make *sure* I got this right", "got this → <b>gotthis</b>"],
    ["Kiểm tra hiểu", "…nghĩa là gì?", "What does … *mean*?", "what does → <b>whuzz</b>"],
    ["Đồng ý, phản đối", "Đúng rồi, chính xác", "*Exactly*", ""],
    ["Đồng ý, phản đối", "Ý hay đấy, nhưng…", "That's a good *point*, but…", ""],
    ["Đồng ý, phản đối", "Không hẳn, đúng hơn là…", "Not *really*, it's more like…", ""],
    ["Đồng ý, phản đối", "Tôi hiểu ý bạn, nhưng…", "I *see* what you mean, but…", ""],
    ["Đồng ý, phản đối", "Còn tuỳ vào…", "It *depends* on…", ""],
    ["Đồng ý, phản đối", "Tôi cũng nghĩ vậy", "I think *so* too", ""],
    ["Đồng ý, phản đối", "Tôi không nghĩ vậy", "I don't think *so*", "don't → <b>dun</b>"],
    ["Đồng ý, phản đối", "Có lý đấy", "That makes *sense*", ""],
    ["Đồng ý, phản đối", "Tôi không chắc lắm về chuyện đó", "I'm not *so* sure about that", ""],
    ["Giải thích", "Lý do là…", "The *reason* is…", ""],
    ["Giải thích", "Ví dụ như là…", "For *example*…", ""],
    ["Giải thích", "Nói cách khác…", "In *other* words…", ""],
    ["Giải thích", "Vấn đề chính là…", "The *main* problem is…", ""],
    ["Giải thích", "Điều quan trọng là…", "What *matters* is…", ""],
    ["Giải thích", "Nói ngắn gọn thì…", "*Long* story short…", ""],
    ["Giải thích", "Khoảng chừng…", "*Roughly*…", ""],
    ["Giải thích", "Thứ nhất…, thứ hai…", "*First*…, and *second*…", ""],
    ["Giải thích", "Hoá ra là…", "It *turns* out that…", "turns out → <b>turnzout</b>"],
    ["Giải thích", "Mấu chốt là…", "The *point* is…", ""],
    ["Hỏi, nhờ", "Bạn giúp tôi… được không?", "Could you *help* me with…?", ""],
    ["Hỏi, nhờ", "Bạn có phiền nếu…?", "Do you *mind* if I…?", "do you → <b>d'you</b>"],
    ["Hỏi, nhờ", "Tôi hỏi một câu được không?", "Can I ask you *something*?", "can I → <b>c'nI</b>"],
    ["Hỏi, nhờ", "Bạn nghĩ sao về…?", "What do you *think* about…?", "what do you → <b>whaddaya</b>"],
    ["Hỏi, nhờ", "Có cách nào để…?", "Is there a *way* to…?", ""],
    ["Hỏi, nhờ", "Bạn có biết… không?", "Do you *happen* to know…?", ""],
    ["Hỏi, nhờ", "Tôi nên làm gì tiếp?", "What should I do *next*?", ""],
    ["Hỏi, nhờ", "Mất bao lâu?", "How *long* does it take?", ""],
    ["Công việc", "Để tôi xem lại rồi báo bạn", "Let me *check* and get back to you", "get back to you → <b>getbackta ya</b>"],
    ["Công việc", "Tôi đang làm việc đó", "I'm *working* on it", ""],
    ["Công việc", "Gần xong rồi", "It's *almost* done", ""],
    ["Công việc", "Tôi gặp một vấn đề", "I *ran* into a problem", "ran into → <b>ranninto</b>"],
    ["Công việc", "Chắc là do…", "It's *probably* because…", ""],
    ["Công việc", "Tôi sẽ lo việc đó", "I'll *take* care of it", ""],
    ["Công việc", "Mình chốt vậy nhé?", "Are we *good* with that?", ""],
    ["Công việc", "Tôi cần thêm thời gian", "I need a bit more *time*", ""],
    ["Công việc", "Để tôi chia sẻ màn hình", "Let me share my *screen*", ""],
    ["Công việc", "Bạn nghe rõ không?", "Can you *hear* me okay?", ""],
    ["Công việc", "Tôi vừa mới làm xong", "I *just* finished it", ""],
    ["Chuyện hằng ngày", "Dạo này thế nào?", "How's it *going*?", "how's it → <b>howzit</b>"],
    ["Chuyện hằng ngày", "Không tệ, còn bạn?", "Not *bad*, you?", ""],
    ["Chuyện hằng ngày", "Bạn đang bận gì thế?", "What have you been *up* to?", "what have you → <b>whaddaya</b>"],
    ["Chuyện hằng ngày", "Nghe hay đấy", "Sounds *good*", ""],
    ["Chuyện hằng ngày", "Không sao đâu", "No *worries*", ""],
    ["Chuyện hằng ngày", "Cảm ơn nhiều nhé", "Thanks a *lot*", "thanks a → <b>thanksa</b>"],
    ["Chuyện hằng ngày", "Xin lỗi, tôi đến muộn", "Sorry I'm *late*", ""],
    ["Chuyện hằng ngày", "Hẹn gặp lại sau", "See you *later*", "see you → <b>seeya</b>"],
    ["Chuyện hằng ngày", "Tôi cũng vậy", "*Same* here", ""],
    ["Chuyện hằng ngày", "Tuỳ bạn", "It's *up* to you", ""],
    ["Chuyện hằng ngày", "Tôi không có ý đó", "That's not what I *meant*", ""],
    ["Chuyện hằng ngày", "Để lần sau nhé", "Maybe *next* time", ""],
    ["Kết thúc", "Tóm lại là…", "So *basically*…", ""],
    ["Kết thúc", "Vậy thôi, hết rồi", "That's about *it*", "that's about → <b>thadzabout</b>"],
    ["Kết thúc", "Còn gì nữa không?", "Anything *else*?", ""],
    ["Kết thúc", "Mình nói chuyện sau nhé", "Let's talk *later*", ""],
    ["Kết thúc", "Rất vui được nói chuyện với bạn", "It was *nice* talking to you", ""],
    ["Kết thúc", "Giữ liên lạc nhé", "Let's keep in *touch*", ""],
  ].map(([sit, vi, en, reduced], i) => ({ id: "c" + i, sit, vi, en, reduced }));

  const TOPICS = [
    "Kể về một ngày làm việc bình thường của bạn.",
    "Một lỗi khó nhất bạn từng sửa: nó là gì, và bạn tìm ra nó thế nào?",
    "Một món ăn bạn thích — nó là gì, ăn ở đâu, vì sao thích.",
    "Nơi bạn đang sống: điểm tốt và điểm không tốt.",
    "Một thứ bạn học được gần đây và vì sao nó hữu ích.",
    "Kế hoạch của bạn cho năm tới.",
    "Một cuốn sách, bộ phim hay kênh YouTube bạn giới thiệu cho người khác.",
    "Một quyết định khó bạn từng phải đưa ra.",
    "Giải thích công việc của bạn cho người không biết gì về lập trình.",
    "Một chuyến đi đáng nhớ.",
  ];

  const INTERVAL_DAYS = [0, 1, 3, 7, 16, 35, 75];
  const KNOWN_BOX = 3;
  const NEW_PER_DAY = 10;
  const DAY_MS = 86400000;
  const PHASE_SECONDS = [240, 180, 120];
  const LOCAL_KEY = "chunkdeck_progress_v1";

  let state = { cards: {}, newDay: "", newCount: 0 };
  let store = { save: async () => {}, label: "" };
  let mode = "review";

  const $ = (id) => document.getElementById(id);
  const today = () => new Date().toISOString().slice(0, 10);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const stressed = (en) => esc(en).replace(/\*(.+?)\*/g, '<span class="s">$1</span>');
  const plain = (en) => en.replace(/\*/g, "");

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); } catch { return null; }
  }
  function saveLocal(s) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch {}
  }

  let writing = Promise.resolve();
  function persist() {
    const snapshot = JSON.parse(JSON.stringify(state));
    saveLocal(snapshot);
    writing = writing.then(() => store.save(snapshot)).catch(() => {
      $("syncNote").textContent = "Không lưu được lên tài khoản — tiến độ vẫn nằm trên trình duyệt này.";
    });
  }

  function cardState(id) { return state.cards[id] || null; }
  function isDue(id, now) { const c = cardState(id); return !!c && c.due <= now; }

  function nextCard() {
    const now = Date.now();
    const due = DECK.filter((c) => isDue(c.id, now)).sort((a, b) => cardState(a.id).due - cardState(b.id).due);
    if (due.length) return { card: due[0], isNew: false };
    if (state.newDay !== today()) { state.newDay = today(); state.newCount = 0; }
    if (state.newCount >= NEW_PER_DAY) return null;
    const fresh = DECK.find((c) => !cardState(c.id));
    return fresh ? { card: fresh, isNew: true } : null;
  }

  function grade(id, verdict) {
    const prev = cardState(id);
    let box = prev ? prev.box : 0;
    if (!prev) state.newCount += 1;
    if (verdict === "again") box = 1;
    else if (verdict === "good") box = Math.min(box + 1, INTERVAL_DAYS.length - 1);
    else box = Math.max(box, 1);
    const days = verdict === "again" ? 0 : INTERVAL_DAYS[box];
    const due = verdict === "again" ? Date.now() + 10 * 60 * 1000 : startOfDay() + days * DAY_MS;
    state.cards = { ...state.cards, [id]: { box, due } };
    persist();
  }
  function startOfDay() { const d = new Date(); d.setHours(4, 0, 0, 0); return d.getTime(); }

  function renderMeter() {
    const now = Date.now();
    $("mDue").textContent = DECK.filter((c) => isDue(c.id, now)).length;
    $("mKnown").textContent = DECK.filter((c) => (cardState(c.id)?.box || 0) >= KNOWN_BOX).length;
    $("mTotal").textContent = DECK.length;
  }

  let voice = null;
  function pickVoice() {
    const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    voice = all.find((v) => /en-US/i.test(v.lang) && /natural|google|samantha|aria|jenny/i.test(v.name))
      || all.find((v) => /en-US/i.test(v.lang))
      || all.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  const canSpeak = () => !!window.speechSynthesis;
  function say(text, rate = 1) {
    if (!canSpeak()) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice?.lang || "en-US";
    if (voice) u.voice = voice;
    u.rate = rate;
    speechSynthesis.speak(u);
  }

  function renderReview() {
    const pick = nextCard();
    const stage = $("stage");
    if (!pick) {
      stage.innerHTML = `<div class="done"><strong>Xong phần hôm nay.</strong>
        <p class="hint">Lịch ôn giãn dần theo khoảng cách — ôn lại cùng một cụm mỗi ngày là lãng phí.
        Quay lại ngày mai, hoặc chuyển sang <b>Nghe chép</b> để luyện tai.</p></div>`;
      return;
    }
    const { card, isNew } = pick;
    stage.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center">
        <span class="situation">${esc(card.sit)}</span>
        <span class="eyebrow">${isNew ? "Cụm mới" : "Đến hạn ôn"}</span>
      </div>
      <p class="prompt-vi">${esc(card.vi)}</p>
      <p class="hint">Nói to cụm tiếng Anh <b>trước khi</b> mở đáp án. Nghĩ không ra cũng phải thử — cố nhớ lại mới là lúc não ghi.</p>
      <div id="reveal" hidden></div>
      <div class="row" id="actions"><button class="btn primary" id="showBtn">Mở đáp án</button></div>`;
    $("showBtn").onclick = () => {
      $("reveal").hidden = false;
      $("reveal").innerHTML = `<div class="answer">
          <p class="chunk">${stressed(card.en)}</p>
          ${card.reduced ? `<div class="reduced">Nói nhanh nghe như: ${card.reduced}</div>` : ""}
        </div>`;
      $("actions").innerHTML = `
        ${canSpeak() ? `<button class="btn icon" id="hear">▶ Nghe</button><button class="btn icon" id="hearSlow">Chậm</button>` : ""}
        <button class="btn again" id="gAgain">Chưa nhớ</button>
        <button class="btn" id="gHard">Nhớ, nhưng khó</button>
        <button class="btn good" id="gGood">Nhớ dễ</button>`;
      if (canSpeak()) {
        $("hear").onclick = () => say(plain(card.en), 1);
        $("hearSlow").onclick = () => say(plain(card.en), 0.75);
        say(plain(card.en), 1);
      }
      const go = (v) => { grade(card.id, v); renderMeter(); renderReview(); };
      $("gAgain").onclick = () => go("again");
      $("gHard").onclick = () => go("hard");
      $("gGood").onclick = () => go("good");
      const box = cardState(card.id)?.box || 0;
      const nextGood = INTERVAL_DAYS[Math.min(box + 1, INTERVAL_DAYS.length - 1)];
      $("actions").insertAdjacentHTML("afterend",
        `<p class="grade-note">Chưa nhớ → gặp lại sau 10 phút · Nhớ dễ → gặp lại sau ${nextGood} ngày</p>`);
      $("gGood").focus();
    };
    $("showBtn").focus();
  }

  const norm = (s) => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean);
  function diffWords(target, typed) {
    const t = norm(target), u = norm(typed);
    const m = t.length, n = u.length;
    const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
      L[i][j] = t[i] === u[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < m && j < n) {
      if (t[i] === u[j]) { out.push(["hit", t[i]]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { out.push(["miss", t[i]]); i++; }
      else { out.push(["extra", u[j]]); j++; }
    }
    while (i < m) out.push(["miss", t[i++]]);
    while (j < n) out.push(["extra", u[j++]]);
    return { out, hits: out.filter((x) => x[0] === "hit").length, total: m };
  }

  let dictCard = null;
  function renderDict() {
    const stage = $("stage");
    if (!canSpeak()) {
      stage.innerHTML = `<p class="warn">Trình duyệt này không có giọng đọc tiếng Anh, nên không nghe chép được. Mở bằng Chrome hoặc Safari.</p>`;
      return;
    }
    const seen = DECK.filter((c) => cardState(c.id));
    const pool = seen.length >= 5 ? seen : DECK;
    dictCard = pool[Math.floor(Math.random() * pool.length)];
    stage.innerHTML = `
      <span class="eyebrow">Nghe → chép từng chữ → đối chiếu</span>
      <p class="hint">Người bản ngữ nói hơn 6 âm tiết mỗi giây, các từ dính vào nhau. Bài này luyện đúng chỗ đó:
      tai cắt sai ở đâu thì chỗ đó hiện màu đỏ.</p>
      <div class="row">
        <button class="btn primary" id="play">▶ Nghe tốc độ thật</button>
        <button class="btn" id="playSlow">Nghe chậm</button>
      </div>
      <label class="eyebrow" for="dictInput">Bạn nghe được gì?</label>
      <input class="dict" id="dictInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đúng những gì nghe thấy…">
      <div class="row"><button class="btn" id="check">Đối chiếu</button><button class="btn" id="skip">Câu khác</button></div>
      <div id="dictResult"></div>`;
    const text = plain(dictCard.en).replace(/…/g, "");
    $("play").onclick = () => say(text, 1);
    $("playSlow").onclick = () => say(text, 0.7);
    $("skip").onclick = renderDict;
    const check = () => {
      const { out, hits, total } = diffWords(text, $("dictInput").value);
      const words = out.map(([k, w]) => `<span class="w-${k}">${esc(w)}</span>`).join("");
      $("dictResult").innerHTML = `
        <div class="diff">${words}</div>
        <p class="score">${hits}/${total} từ đúng · gốc: “${esc(text)}” — ${esc(dictCard.vi)}</p>
        ${dictCard.reduced ? `<div class="reduced">Chỗ hay bị nghe sót: ${dictCard.reduced}</div>` : ""}`;
    };
    $("check").onclick = check;
    $("dictInput").onkeydown = (e) => { if (e.key === "Enter") check(); };
    setTimeout(() => say(text, 1), 250);
  }

  let timer = null, phase = 0, left = PHASE_SECONDS[0], topic = TOPICS[0];
  function stopTimer() { if (timer) clearInterval(timer); timer = null; }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.25);
    } catch {}
  }
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function renderSpeak(newTopic) {
    stopTimer();
    if (newTopic) { topic = TOPICS[Math.floor(Math.random() * TOPICS.length)]; phase = 0; left = PHASE_SECONDS[0]; }
    const learned = DECK.filter((c) => (cardState(c.id)?.box || 0) >= 1);
    const src = learned.length >= 3 ? learned : DECK;
    const weave = [...src].sort(() => Math.random() - 0.5).slice(0, 3);
    $("stage").innerHTML = `
      <span class="eyebrow">Chủ đề</span>
      <p class="topic">${esc(topic)}</p>
      <div class="phases">${PHASE_SECONDS.map((s, i) =>
        `<div class="phase" data-state="${i < phase ? "done" : i === phase ? "now" : "next"}">Lần ${i + 1}<b>${fmt(s)}</b></div>`).join("")}</div>
      <div class="clock" id="clock">${fmt(left)}</div>
      <div class="row">
        <button class="btn primary" id="startBtn">${phase >= PHASE_SECONDS.length ? "Làm lại" : "Bắt đầu lần " + (phase + 1)}</button>
        <button class="btn" id="newTopic">Chủ đề khác</button>
      </div>
      <span class="eyebrow">Thử cài vào lúc nói</span>
      <div class="weave">${weave.map((c) => `<span>${esc(plain(c.en))}</span>`).join("")}</div>
      <p class="hint">Kể cùng một chuyện cả ba lần, không đổi nội dung. Thời gian ngắn dần buộc bạn nói bằng cụm có sẵn thay vì dịch từ tiếng Việt. Ghi âm bằng điện thoại rồi nghe lại lần 1 và lần 3 để thấy khác biệt.</p>`;
    $("newTopic").onclick = () => renderSpeak(true);
    $("startBtn").onclick = () => {
      if (phase >= PHASE_SECONDS.length) { phase = 0; left = PHASE_SECONDS[0]; renderSpeak(false); return; }
      $("startBtn").disabled = true;
      timer = setInterval(() => {
        left -= 1;
        $("clock").textContent = fmt(Math.max(left, 0));
        if (left <= 0) {
          stopTimer(); beep(); phase += 1;
          left = PHASE_SECONDS[phase] ?? 0;
          renderSpeak(false);
        }
      }, 1000);
    };
  }

  const WHY = {
    review: "Hiện nghĩa tiếng Việt, bạn phải <b>tự nhớ ra</b> cụm tiếng Anh trước khi xem — tự nhớ lại hiệu quả hơn đọc lại (g = 0.50, Rowland 2014). Lịch ôn giãn dần 1 → 3 → 7 → 16 → 35 → 75 ngày theo nghiên cứu về khoảng cách ôn (Cepeda 2008). Chữ gạch chân màu cam là <b>từ được nhấn</b> — sai trọng âm câu làm người nghe khó hiểu hơn sai phát âm.",
    dict: "Người học đọc tốt thường <b>biết từ nhưng không nhận ra nó khi nghe</b>, vì các từ dính liền và biến âm (Field 2008). Nghe thụ động không sửa được điều đó; chép lại từng chữ rồi đối chiếu thì có.",
    speak: "Kể cùng một chuyện 3 lần trong 4, 3, rồi 2 phút (Nation 1989). Tốc độ nói tăng và ngập ngừng giảm ngay giữa lần đầu và lần thứ ba — thời gian ép buộc não tự động hoá.",
  };

  function setMode(m) {
    mode = m;
    stopTimer();
    if (window.speechSynthesis) speechSynthesis.cancel();
    $("tabReview").setAttribute("aria-selected", m === "review");
    $("tabDict").setAttribute("aria-selected", m === "dict");
    $("tabSpeak").setAttribute("aria-selected", m === "speak");
    $("why").innerHTML = WHY[m];
    if (m === "review") renderReview();
    else if (m === "dict") renderDict();
    else renderSpeak(true);
  }
  $("tabReview").onclick = () => setMode("review");
  $("tabDict").onclick = () => setMode("dict");
  $("tabSpeak").onclick = () => setMode("speak");

  const local = loadLocal();
  if (local && local.cards) state = local;
  renderMeter();
  setMode("review");

  (async () => {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    try {
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.cards && Object.keys(remote.cards).length >= Object.keys(state.cards).length) {
        state = { cards: remote.cards, newDay: remote.newDay || "", newCount: remote.newCount || 0 };
        saveLocal(state);
        renderMeter();
        if (mode === "review") renderReview();
      }
      store = { save: (s) => ref.set(s) };
      $("syncNote").textContent = "Tiến độ lưu theo tài khoản — mở trên máy khác vẫn giữ lịch ôn.";
      if (!snap.exists && Object.keys(state.cards).length) persist();
    } catch {
      $("syncNote").textContent = "Không kết nối được kho lưu — tiến độ vẫn nằm trên trình duyệt này.";
    }
  })();
})();
</script>
